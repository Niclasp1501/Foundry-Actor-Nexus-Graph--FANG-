name: Validate

# Runs on every pull request and on pushes to the working branches.
#
# The check says: the JSON parses, all ten locales have the same keys as
# en.json, no placeholder was lost, every script parses as an ES module and
# every stylesheet has balanced braces. Each of these broke once before anyone
# noticed.

on:
  pull_request:
  push:
    branches:
      - main
      - beta

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate locales, scripts and stylesheets
        run: node tools/fang-validate.mjs
