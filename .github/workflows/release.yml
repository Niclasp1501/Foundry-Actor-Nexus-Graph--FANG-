name: Release Creation

on:
  push:
    tags:
      - "v*" # triggers on tags like v1.0.0

jobs:
  build:
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, 'beta') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Module Archive
        run: zip -r ./module.zip . -x ".git/*" ".github/*" "README.md" "CHANGELOG.md" "tools/*" ".gitignore" "*.md"

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' module.json)" >> "$GITHUB_OUTPUT"

      # The release text is the changelog section of this version: what changed, for
      # the person who was just offered the update. Not the whole file, not nothing.
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python .github/scripts/release_notes.py

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            module.json
            module.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} (FVTT 13-14)
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Module to FoundryVTT Website
        uses: cs96and/FoundryVTT-release-package@v1
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
          manifest-url: https://github.com/Niclasp1501/Foundry-Actor-Nexus-Graph--FANG-/releases/download/${{ github.ref_name }}/module.json
