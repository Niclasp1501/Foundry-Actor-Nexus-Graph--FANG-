name: Weblate auto-merge

# Turns Weblate's pull requests into something that does not need a human.
#
# **It runs after `Validate`, not beside it.** The trigger is the *completion*
# of that workflow, so by the time this job starts the JSON has parsed, every
# locale has the same keys as `en.json`, and no placeholder was lost. A failed
# validation never reaches this file. That ordering is why there is no branch
# protection on `main`: protecting the branch would gate the maintainer's own
# pushes as well, for a guarantee this already provides.
#
# **What it will merge, and nothing else.** A pull request qualifies only if
# every one of these holds:
#
#   1. `Validate` concluded successfully for it,
#   2. it comes from a bot account,
#   3. it touches nothing but files under `lang/`,
#   4. it touches neither `lang/de.json` nor `lang/en.json`.
#
# The fourth rule is the important one. German and English are written here, and
# a stranger changing them is a content decision, not a translation — that gets
# read by a person. The other eight languages nobody here can read anyway, so a
# volunteer's version is strictly better than what the machine produced, and
# waiting for a review that cannot happen only means it never lands.
#
# Nothing from the pull request is checked out or executed in this job. It reads
# the file list through the API and calls `gh`. That is what keeps a workflow
# holding a write token safe.

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Find the pull request and decide
        id: pruefung
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          nummer=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            -H "Accept: application/vnd.github+json" --jq '.[0].number // empty')
          if [ -z "$nummer" ]; then
            echo "No pull request for $SHA — nothing to do."
            echo "merge=nein" >> "$GITHUB_OUTPUT"; exit 0
          fi

          autor=$(gh api "repos/$REPO/pulls/$nummer" --jq '.user.login')
          typ=$(gh api "repos/$REPO/pulls/$nummer" --jq '.user.type')
          echo "PR #$nummer by $autor ($typ)"

          # Only bots. A human opening a translation PR gets a human reading it.
          if [ "$typ" != "Bot" ] && ! echo "$autor" | grep -qiE 'weblate'; then
            echo "Not a translation bot — leaving it alone."
            echo "merge=nein" >> "$GITHUB_OUTPUT"; exit 0
          fi

          dateien=$(gh api "repos/$REPO/pulls/$nummer/files" --paginate --jq '.[].filename')
          echo "Touched files:"; echo "$dateien" | sed 's/^/  /'

          merge=ja
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              lang/de.json|lang/en.json) merge=nein ;;
              lang/*.json) ;;
              *) merge=nein ;;
            esac
          done <<< "$dateien"

          [ "$merge" = "nein" ] && echo "Touches German, English or something outside lang/ — a person looks at this one."
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "nummer=$nummer" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.pruefung.outputs.merge == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh pr merge --squash --delete-branch "${{ steps.pruefung.outputs.nummer }}" --repo "$REPO"
